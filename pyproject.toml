[project]
name = "mattmademe-marketing-os"
version = "0.1.0"
description = "Local-first Marketing Operating System for MattMadeMe"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "Flask>=3.0,<4.0",
    "gunicorn>=22.0,<24.0",
    "Pillow>=10.0,<13.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.scripts]
marketing-os-admin = "marketing_os.admin_cli:main"
marketing-os-preflight = "marketing_os.jobs.capability_preflight:main"
marketing-os-status = "marketing_os.jobs.operational_status:main"
marketing-os-scheduler = "marketing_os.jobs.durable_scheduler:main"
marketing-os-web = "marketing_os.web_app:main"
marketing-os-worker = "marketing_os.jobs.durable_worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["marketing_os*"]
