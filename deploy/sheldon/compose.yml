services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: ${MARKETING_OS_SECRETS_FILE}
    volumes:
      - marketing-os-postgres:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
    env_file: ${MARKETING_OS_SECRETS_FILE}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  web:
    build:
      context: ../..
    restart: unless-stopped
    env_file: ${MARKETING_OS_SECRETS_FILE}
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "--access-logfile", "-", "marketing_os.wsgi:app"]
    ports:
      - "127.0.0.1:${MARKETING_OS_LOOPBACK_PORT:-3081}:8080"
    volumes:
      - marketing-os-assets:/app/assets
      - marketing-os-outputs:/app/outputs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
    restart: unless-stopped
    env_file: ${MARKETING_OS_SECRETS_FILE}
    command: ["marketing-os-worker"]
    volumes:
      - marketing-os-assets:/app/assets
      - marketing-os-outputs:/app/outputs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  scheduler:
    build:
      context: ../..
    restart: unless-stopped
    env_file: ${MARKETING_OS_SECRETS_FILE}
    command: ["marketing-os-scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

networks:
  private:
    internal: true

volumes:
  marketing-os-postgres:
  marketing-os-assets:
  marketing-os-outputs:
