<article class="task">
  <a class="task-title" href="{{ url_for('task_detail', task_id=task.id) }}">{{ task.title }}</a>
  <div class="meta">
    <span class="pill">{{ task.due_date }}</span>
    <span class="pill">{{ task.owner_role }}</span>
    <span class="pill">{{ task.platform }} {{ task.content_type }}</span>
    <span class="pill {{ 'complete' if task.status == 'complete' else 'blocked' if task.status == 'blocked' else 'ready' if task.status == 'ready to post' else '' }}">{{ task.status }}</span>
  </div>
  <div class="subtle">{{ task.product_name or "Owner/admin task" }}</div>
</article>
