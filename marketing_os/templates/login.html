<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Social Media Manager</title>
    <style>
      :root {
        --ink: #151515;
        --muted: #626665;
        --line: #e7dfc7;
        --line-strong: #d2c48d;
        --panel: #ffffff;
        --field: #fffdf0;
        --canvas: #fff9db;
        --nav: #090909;
        --nav-2: #1f1a11;
        --accent: #087fe8;
        --accent-strong: #07589c;
        --accent-soft: #dceeff;
        --gold: #ffe005;
        --gold-soft: #fff5a8;
        --rose: #d80b1f;
        --rose-soft: #ffe1e5;
        --shadow: 0 18px 50px rgba(21, 21, 21, .12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(255,224,5,.18), transparent 42%),
          var(--canvas);
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }
      a { color: var(--accent); text-decoration: none; }
      .auth-shell { width: min(420px, 100%); display: grid; gap: 14px; }
      .brand-lockup {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        padding: 4px 2px;
      }
      .brand-mark {
        width: 86px;
        height: 62px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
        border: 2px solid #050505;
        box-shadow: 0 8px 0 rgba(0,0,0,.28);
      }
      .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .brand-copy h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.15;
        letter-spacing: 0;
      }
      .nav-tagline { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
      .auth-card {
        position: relative;
        overflow: hidden;
        background: rgba(255,255,255,.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px 20px 20px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 14px;
      }
      .auth-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: linear-gradient(90deg, var(--gold), var(--accent), var(--rose));
      }
      .eyebrow {
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: .08em;
        margin: 0;
      }
      .auth-card h2 {
        margin: 0;
        font-size: clamp(26px, 5vw, 32px);
        line-height: 1.1;
      }
      .subtle { margin: 0; color: var(--muted); }
      .flash-error {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ffc5bd;
        background: var(--rose-soft);
        color: var(--rose);
        font-weight: 650;
      }
      form { display: grid; gap: 4px; margin: 0; }
      label { display: grid; gap: 4px; font-weight: 650; margin-bottom: 10px; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        background: white;
      }
      input:focus {
        outline: 2px solid rgba(8, 127, 232, .35);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      button {
        margin-top: 4px;
        width: 100%;
        border: 1px solid var(--accent-strong);
        background: var(--accent);
        color: white;
        border-radius: 8px;
        padding: 11px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(8, 127, 232, .16);
      }
      button:hover { background: var(--accent-strong); }
      .auth-foot {
        margin: 0;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand-lockup">
        <div class="brand-mark">
          <img src="{{ url_for('static', filename='brand/mattmademe_logo.png') }}" alt="MattMadeMe logo">
        </div>
        <div class="brand-copy">
          <h1>Social Media Manager</h1>
          <p class="nav-tagline">MattMadeMe content console</p>
        </div>
      </div>
      <main class="auth-card">
        <p class="eyebrow">Operator access</p>
        <h2>Sign in</h2>
        <p class="subtle">Use your Marketing OS credentials to open the console.</p>
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
          <input type="hidden" name="_login_csrf" value="{{ login_csrf }}">
          <label>Username <input name="username" autocomplete="username" required></label>
          <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
        </form>
      </main>
      <p class="auth-foot">MattMadeMe Marketing OS</p>
    </div>
  </body>
</html>
