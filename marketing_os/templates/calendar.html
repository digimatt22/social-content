{% extends "base.html" %}
{% block content %}
<div class="topline">
  <div>
    <h2>Calendar</h2>
    <div class="subtle">Admin view of the full 30-day plan.</div>
  </div>
</div>

<section class="grid">
  {% for model in tasks %}
    {% set task = model.task %}
    {% include "_task_card.html" %}
  {% else %}
    <div class="panel">No plan tasks found.</div>
  {% endfor %}
</section>
{% endblock %}
